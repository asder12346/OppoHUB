    <script>
      // Defensive shim to allow browser extensions/interceptors to set window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            }
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto && Object.getOwnPropertyDescriptor(proto, 'fetch')) {
              var protoFetch = window.fetch;
              Object.defineProperty(proto, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return protoFetch;
                },
                set: function(newFetch) {
                  protoFetch = newFetch;
                }
              });
            }
          } catch (ignored) {}
        }
      })();
    </script>
